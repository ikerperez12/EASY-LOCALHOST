name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run static security scan
        run: python -m bandit -r src -q

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean EasyLocalhost.spec

      - name: Generate SHA256
        shell: powershell
        run: |
          $hash = Get-FileHash dist/EasyLocalhost.exe -Algorithm SHA256
          "$($hash.Hash)  EasyLocalhost.exe" | Out-File -Encoding ascii dist/EasyLocalhost.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyLocalhost-windows
          path: |
            dist/EasyLocalhost.exe
            dist/EasyLocalhost.exe.sha256

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EasyLocalhost.exe
            dist/EasyLocalhost.exe.sha256
